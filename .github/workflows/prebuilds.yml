name: Prebuilds

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  prebuild:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            install: sudo apt-get update && sudo apt-get install -y espeak-ng libespeak-ng-dev
          - os: ubuntu-22.04-arm
            arch: arm64
            install: sudo apt-get update && sudo apt-get install -y espeak-ng libespeak-ng-dev
          - os: windows-latest
            arch: x64
            install: choco install espeak-ng -y
          - os: macos-latest
            arch: arm64
            install: brew install espeak-ng
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - run: ${{ matrix.install }}
      - run: npm install --no-save prebuildify node-gyp
      - run: npx prebuildify --napi --strip -n espeak_bridge --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v6
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds/
